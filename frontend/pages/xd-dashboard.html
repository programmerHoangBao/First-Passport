<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XD Dashboard</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="container header">
      <h1>XD - Xét duyệt hồ sơ</h1>
      <nav class="nav">
        <a href="../index.html">Trang chủ</a>
        <a href="register.html">Đăng ký</a>
        <a href="xt-dashboard.html">XT</a>
        <a href="lt-dashboard.html">LT</a>
        <a href="gs-dashboard.html">GS</a>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <div class="toolbar">
          <h2>Danh sách hồ sơ</h2>
          <div style="display: flex; gap: 8px; align-items: center">
            <select id="filter-status">
              <option value="pending">Chờ xét duyệt</option>
              <option value="approved">Đã phê duyệt</option>
              <option value="rejected">Đã từ chối</option>
            </select>
            <span id="count" class="badge">0</span>
          </div>
        </div>
        <div id="msg"></div>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Approval Id</th>
                <th>Form Id</th>
                <th>Tạo bởi</th>
                <th>Ngày tạo</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module">
      import { apiGet, apiPost, apiPut } from "../js/api.js";
      import { $, showMessage } from "../js/utils.js";
      import { requireRole } from "../js/auth.js";

      // Chỉ cho phép vai trò XD
      requireRole("XD");

      const rows = $("#rows");
      const msg = $("#msg");
      const count = $("#count");
      const filterStatus = $("#filter-status");

      // === Hàm tải danh sách hồ sơ ===
      async function load() {
        msg.innerHTML = "";
        rows.innerHTML = '<tr><td colspan="5">Đang tải...</td></tr>';

        const selectedFilter = filterStatus.value;

        try {
          let data;

          if (selectedFilter === "pending") {
            // Lấy danh sách hồ sơ chưa được xét duyệt
            data = await apiGet("/api/xd/all-send-from-to-xd");
          } else {
            // Lấy danh sách hồ sơ đã duyệt
            const result =
              selectedFilter === "approved" ? "APPROVED" : "REJECTED";
            data = await apiGet(
              `/api/xd/all-approval-by-result?result=${result}&pageNumber=0&pageSize=100`
            );
          }

          const content = data?.content || [];
          count.textContent = String(content.length);

          if (content.length === 0) {
            rows.innerHTML = '<tr><td colspan="5">Không có dữ liệu</td></tr>';
            return;
          }

          // Render bảng
          rows.innerHTML = content
            .map((it) => {
              const isPending = selectedFilter === "pending";
              const statusBadge = isPending
                ? `
                  <button class="success" data-approve="${it.approvalId}">Phê duyệt</button>
                  <button class="danger" data-reject="${it.approvalId}">Từ chối</button>
                `
                : `
                  <span class="badge ${
                    selectedFilter === "approved" ? "success" : "danger"
                  }">
                    ${
                      selectedFilter === "approved"
                        ? "Đã phê duyệt"
                        : "Đã từ chối"
                    }
                  </span>
                `;

              return `
                <tr>
                  <td>${it.approvalId ?? ""}</td>
                  <td>${it.formId ?? ""}</td>
                  <td>${it.createdBy ?? ""}</td>
                  <td>${it.createdAt ?? ""}</td>
                  <td>${statusBadge}</td>
                </tr>
              `;
            })
            .join("");
        } catch (err) {
          rows.innerHTML = "";
          // Kiểm tra nếu là lỗi No data
          if (err.message && err.message.includes('No data')) {
            rows.innerHTML = '<tr><td colspan="5" style="text-align:center;">Hiện tại không có dữ liệu</td></tr>';
            count.textContent = '0';
          } else {
            showMessage(msg, "error", err.message || "Không tải được dữ liệu");
          }
        }
      }

      // === Sự kiện khi click vào nút phê duyệt / từ chối ===
      rows.addEventListener("click", async (e) => {
        const approveBtn = e.target.closest("button[data-approve]");
        const rejectBtn = e.target.closest("button[data-reject]");
        if (!approveBtn && !rejectBtn) return;

        let approvalId;
        if (approveBtn) {
          approvalId = approveBtn.getAttribute("data-approve");
        } else if (rejectBtn) {
          approvalId = rejectBtn.getAttribute("data-reject");
        }

        if (!approvalId) {
          showMessage(msg, "error", "Không tìm thấy approvalId hợp lệ!");
          return;
        }

        const button = approveBtn || rejectBtn;
        button.disabled = true;

        try {
          const currentUserId = 1; // TODO: thay bằng ID từ token người dùng

          if (approveBtn) {
            await apiPost(
              `/api/xd/approval?approvalId=${approvalId}&approvalBy=${currentUserId}`
            );
          } else if (rejectBtn) {
            await apiPut(
              `/api/xd/reject-approval?approvalId=${approvalId}&approverBy=${currentUserId}`
            );
          }

          await load();
          showMessage(msg, "success", button.textContent + " thành công!");
        } catch (err) {
          showMessage(msg, "error", err.message || "Thao tác thất bại");
        } finally {
          button.disabled = false;
        }
      });

      // === Filter thay đổi thì load lại ===
      filterStatus.addEventListener("change", load);

      // === Lần đầu load ===
      load();
    </script>
  </body>
</html>
