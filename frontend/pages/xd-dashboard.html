<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XD Dashboard</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <header class="container header">
      <h1>XD - Xét duyệt hồ sơ</h1>
      <nav class="nav">
        <a href="../index.html">Trang chủ</a>
        <a href="register.html">Đăng ký</a>
        <a href="xt-dashboard.html">XT</a>
        <a href="lt-dashboard.html">LT</a>
        <a href="gs-dashboard.html">GS</a>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <div class="toolbar">
          <h2>Danh sách hồ sơ</h2>
          <div style="display: flex; gap: 8px; align-items: center;">
            <select id="filter-status">
              <option value="pending">Chờ xét duyệt</option>
              <option value="approved">Đã phê duyệt</option>
              <option value="rejected">Đã từ chối</option>
            </select>
            <span id="count" class="badge">0</span>
          </div>
        </div>
        <div id="msg"></div>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Mã hồ sơ</th>
                <th>Họ tên</th>
                <th>CMND</th>
                <th>Email</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module">
      import { apiGet, apiPost } from '../js/api.js';
      import { $, showMessage } from '../js/utils.js';
      import { requireRole } from '../js/auth.js';

      // chỉ cho phép vai trò XD
      requireRole('XD');

      const rows = $('#rows');
      const msg = $('#msg');
      const count = $('#count');
      const filterStatus = $('#filter-status');

      async function load(){
        msg.innerHTML = '';
        rows.innerHTML = '<tr><td colspan="5">Đang tải...</td></tr>';
        
        const selectedFilter = filterStatus.value;
        
        try{
          let data;
          
          if (selectedFilter === 'pending') {
            // Lấy danh sách hồ sơ chưa được xét duyệt
            data = await apiGet('/api/xd/all-send-from-to-xd?pageNumber=0&pageSize=100');
          } else {
            // Lấy danh sách hồ sơ đã được xét duyệt
            const result = selectedFilter === 'approved' ? 'APPROVED' : 'REJECTED';
            data = await apiGet(`/api/xd/all-approval-by-result?result=${result}&pageNumber=0&pageSize=100`);
          }
          
          // Lấy content từ response (vì API trả về Page object)
          const content = data?.content || [];
          count.textContent = String(content?.length || 0);
          
          rows.innerHTML = content.map(it=>{
            const actionButtons = selectedFilter === 'pending' ? `
              <button class="success" data-approve="${it.id}">Phê duyệt</button>
              <button class="danger" data-reject="${it.id}">Từ chối</button>
            ` : `
              <span class="badge ${selectedFilter === 'approved' ? 'success' : 'danger'}">
                ${selectedFilter === 'approved' ? 'Đã phê duyệt' : 'Đã từ chối'}
              </span>
            `;
            
            return `
              <tr>
                <td>${it.id ?? ''}</td>
                <td>${it.fullName ?? ''}</td>
                <td>${it.identityNumber ?? ''}</td>
                <td>${it.email ?? ''}</td>
                <td>${actionButtons}</td>
              </tr>
            `;
          }).join('');
        }catch(err){
          rows.innerHTML = '';
          showMessage(msg, 'error', err.message || 'Không tải được dữ liệu');
        }
      }

      rows.addEventListener('click', async (e)=>{
        const approveBtn = e.target.closest('button[data-approve]');
        const rejectBtn = e.target.closest('button[data-reject]');
        if(!approveBtn && !rejectBtn) return;
        
        const approvalId = (approveBtn||rejectBtn).getAttribute('data-approve') || (approveBtn||rejectBtn).getAttribute('data-reject');
        const button = (approveBtn||rejectBtn);
        button.disabled = true;
        
        try{
          // Lấy thông tin user hiện tại từ token hoặc context
          // Tạm thời sử dụng ID = 1, cần cải thiện để lấy từ user context thực tế
          const currentUserId = 1;
          
          if (approveBtn) {
            await apiPost('/api/xd/approval', {
              formId: parseInt(approvalId),
              result: 'APPROVED',
              approvedAt: new Date().toISOString(),
              approverBy: currentUserId
            });
          }
          
          if (rejectBtn) {
            await apiPost('/api/xd/approval', {
              formId: parseInt(approvalId),
              result: 'REJECTED',
              approvedAt: new Date().toISOString(),
              approverBy: currentUserId
            });
          }
          
          await load();
          showMessage(msg, 'success', button.textContent + ' thành công!');
        }catch(err){
          showMessage(msg, 'error', err.message || 'Thao tác thất bại');
        }finally{
          button.disabled = false;
        }
      });

      // Thêm event listener cho filter
      filterStatus.addEventListener('change', load);

      load();
    </script>
  </body>
  </html>
