<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <header class="container header">
      <h1>Đăng nhập</h1>
      <nav class="nav">
        <a href="../index.html">Trang chủ</a>
        <a href="register.html">Đăng ký</a>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <form id="login-form" class="grid" style="max-width:420px">
          <div>
            <label>Tên đăng nhập</label>
            <input name="username" required />
          </div>
          <div>
            <label>Mật khẩu</label>
            <input type="password" name="password" required />
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button type="submit">Đăng nhập</button>
          </div>
        </form>
        <div id="msg" style="margin-top:12px"></div>
      </section>
    </main>

    <script type="module">
      import { $, showMessage } from '../js/utils.js';
      import { login } from '../js/auth.js';

      const form = $('#login-form');
      const msg = $('#msg');

      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        msg.innerHTML = '';
        const data = Object.fromEntries(new FormData(form).entries());
        try{
          const role = await login(data.username, data.password);
          showMessage(msg, 'success', `Đăng nhập thành công (${role||'N/A'})`);
          // Điều hướng theo vai trò
          const r = String(role||'').toUpperCase().replace(/^ROLE_/,'');
          if (r === 'XT') window.location.href = './xt-dashboard.html';
          else if (r === 'XD') window.location.href = './xd-dashboard.html';
          else if (r === 'LT') window.location.href = './lt-dashboard.html';
          else if (r === 'GS') window.location.href = './gs-dashboard.html';
          else window.location.href = '../index.html';
        }catch(err){
          showMessage(msg, 'error', err.message || 'Đăng nhập thất bại');
        }
      });
    </script>
  </body>
  </html>
