<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GS Dashboard</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <header class="container header">
      <h1>GS - Giám sát luồng xử lý</h1>
      <nav class="nav">
        <a href="../index.html">Trang chủ</a>
        <a href="register.html">Đăng ký</a>
        <a href="xt-dashboard.html">XT</a>
        <a href="xd-dashboard.html">XD</a>
        <a href="lt-dashboard.html">LT</a>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <div class="toolbar">
          <h2>Nhật ký hoạt động</h2>
          <button id="refresh" class="secondary">Tải lại</button>
        </div>
        <div id="msg"></div>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Thời gian</th>
                <th>Mã hồ sơ</th>
                <th>Hành động</th>
                <th>Đơn vị</th>
                <th>Ghi chú</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module">
      import { apiGet } from '../js/api.js';
      import { $, showMessage, formatDate } from '../js/utils.js';
      import { requireRole } from '../js/auth.js';

      // chỉ cho phép vai trò GS
      requireRole('GS');

      const rows = $('#rows');
      const msg = $('#msg');
      const refresh = $('#refresh');

      async function load(){
        msg.innerHTML = '';
        rows.innerHTML = '<tr><td colspan="5">Đang tải...</td></tr>';
        try{
          const data = await apiGet('/api/passport/logs');
          rows.innerHTML = (data||[]).map(it=>`
            <tr>
              <td>${formatDate(it.timestamp)}</td>
              <td>${it.passportId ?? it.registrationId ?? ''}</td>
              <td>${it.action ?? ''}</td>
              <td>${it.department ?? ''}</td>
              <td>${it.note ?? ''}</td>
            </tr>
          `).join('');
        }catch(err){
          rows.innerHTML = '';
          showMessage(msg, 'error', err.message || 'Không tải được dữ liệu');
        }
      }

      refresh.addEventListener('click', load);
      load();
    </script>
  </body>
  </html>
