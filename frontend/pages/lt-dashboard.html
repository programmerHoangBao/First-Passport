<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LT Dashboard</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="container header">
      <h1>LT - Lưu trữ hồ sơ đã phê duyệt</h1>
      <nav class="nav">
        <a href="../index.html">Trang chủ</a>
        <a href="register.html">Đăng ký</a>
        <a href="xt-dashboard.html">XT</a>
        <a href="xd-dashboard.html">XD</a>
        <a href="gs-dashboard.html">GS</a>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <div class="toolbar">
          <h2>Danh sách hồ sơ đã phê duyệt</h2>
          <span id="count" class="badge">0</span>
        </div>
        <div id="msg"></div>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Approval ID</th>
                <th>Người tạo</th>
                <th>Ngày tạo</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module">
      import { apiGet, apiPost } from "../js/api.js";
      import { $, showMessage, formatDate } from "../js/utils.js";
      import { requireRole } from "../js/auth.js";

      // Chỉ cho phép vai trò LT truy cập
      requireRole("LT");

      const rows = $("#rows");
      const msg = $("#msg");
      const count = $("#count");

      async function load() {
        msg.innerHTML = "";
        rows.innerHTML = '<tr><td colspan="4">Đang tải...</td></tr>';

        try {
          const data = await apiGet("/api/lt/all-request-store");
          const content = data?.content || data || [];
          count.textContent = String(content.length || 0);

          if (content.length === 0) {
            rows.innerHTML =
              '<tr><td colspan="4" style="text-align:center;">Không có dữ liệu</td></tr>';
            return;
          }

          rows.innerHTML = content
            .map(
              (it) => `
                <tr>
                  <td>${it.approvalId ?? ""}</td>
                  <td>${it.createdBy ?? ""}</td>
                  <td>${formatDate(it.createdAt)}</td>
                  <td>
                    <button class="success" data-approve="${it.approvalId}">
                      Lưu trữ
                    </button>
                    <button class="danger" data-reject="${it.approvalId}">
                      Từ Chối
                    </button>
                  </td>
                </tr>
              `
            )
            .join("");
        } catch (err) {
          rows.innerHTML = "";
          showMessage(msg, "error", err.message || "Không tải được dữ liệu");
        }
      }

      // Xử lý click cho APPROVE / REJECT
      rows.addEventListener("click", async (e) => {
        const approveBtn = e.target.closest("button[data-approve]");
        const rejectBtn = e.target.closest("button[data-reject]");
        const currentUserId = 1; // TODO: thay bằng user ID thực tế
        let approvalId;

        if (approveBtn) {
          approvalId = approveBtn.getAttribute("data-approve");
          approveBtn.disabled = true;

          try {
            await apiPost(
              `/api/lt/create-passport?approvalId=${approvalId}&userId=${currentUserId}`
            );
            showMessage(msg, "success", "Đã lưu dữ liệu thành công!");
            await load();
          } catch (err) {
            showMessage(
              msg,
              "error",
              err.message || "❌ Không thể lưu dữ liệu"
            );
          } finally {
            approveBtn.disabled = false;
          }
        }

        if (rejectBtn) {
          approvalId = rejectBtn.getAttribute("data-reject");
          rejectBtn.disabled = true;

          if (!confirm("Bạn có chắc muốn từ chối lưu trữ hồ sơ này?")) {
            rejectBtn.disabled = false;
            return;
          }

          try {
            await apiPost(
              `/api/lt/reject-passport?approvalId=${approvalId}&userId=${currentUserId}`
            );
            showMessage(msg, "success", "Đã từ chối lưu trữ hồ sơ!");
            await load();
          } catch (err) {
            showMessage(
              msg,
              "error",
              err.message || "❌ Không thể từ chối lưu trữ hồ sơ"
            );
          } finally {
            rejectBtn.disabled = false;
          }
        }
      });

      load();
    </script>
  </body>
</html>
